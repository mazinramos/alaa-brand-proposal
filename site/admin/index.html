<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم براند ألاء | Alaa Mahjob Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%239A5C6D'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23fff' font-family='Georgia,serif'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="antialiased">

<div id="toastWrap" class="fixed bottom-5 inset-x-0 z-[999] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>
<div id="modalRoot"></div>

<!-- LOGIN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center px-5 strip-pat">
  <form id="loginForm" class="w-full max-w-sm card p-8 shadow-2xl" style="box-shadow:0 40px 80px -40px rgba(122,68,85,.5)">
    <div class="flex flex-col items-center mb-7 leading-none">
      <svg width="40" height="40" viewBox="0 0 64 64" fill="none" stroke="#9A5C6D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 22v-4a5 5 0 1 1 5 5"/><path d="M32 22 6 44a3 3 0 0 0 2 5h48a3 3 0 0 0 2-5z"/></svg>
      <span class="logo-script text-5xl text-mauve mt-1">Alaa</span>
      <span class="text-[10px] tracking-[.2em] text-mauve/70 mt-1">FASHION DESIGNER</span>
      <p class="font-bold mt-4">لوحة تحكم براند ألاء</p>
      <p class="text-xs muted mt-1">دخول فريق العمل فقط</p>
    </div>
    <div class="space-y-4">
      <div><label class="label" for="loginEmail">البريد الإلكتروني</label><input required id="loginEmail" type="email" autocomplete="username" class="input" dir="ltr" placeholder="ALAA_EMAIL"></div>
      <div><label class="label" for="loginPassword">كلمة المرور</label><input required id="loginPassword" type="password" autocomplete="current-password" class="input" dir="ltr" placeholder="••••••••"></div>
      <p id="loginError" class="hidden text-sm rounded-xl px-4 py-2.5" style="background:var(--critBg);color:var(--crit)"></p>
      <button id="loginSubmitBtn" class="btn w-full !py-3">دخول</button>
      <button type="button" id="forgotBtn" class="w-full text-xs text-mauve hover:underline">نسيت كلمة المرور؟</button>
    </div>
  </form>
</div>

<!-- APP -->
<div id="adminApp" class="hidden">
  <!-- mobile top bar -->
  <div class="lg:hidden sticky top-0 z-[90] bg-cream/95 backdrop-blur border-b border-[color:var(--line)] px-4 h-14 flex items-center justify-between">
    <button id="menuBtn" class="btn-icon" aria-label="القائمة"><i class="fa-solid fa-bars text-lg"></i></button>
    <span class="logo-script text-3xl text-mauve leading-none">Alaa</span>
    <div class="flex items-center gap-1">
      <button class="btn-icon" data-act="openCmd" aria-label="بحث"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="btn-icon relative" data-act="openBell" aria-label="التنبيهات"><i class="fa-regular fa-bell"></i><span class="bellCount hidden absolute -top-0.5 -left-0.5 bg-mauveD text-white text-[9px] font-bold min-w-[16px] h-4 rounded-full flex items-center justify-center px-1"></span></button>
    </div>
  </div>

  <div class="flex">
    <div id="sideBg" class="hidden fixed inset-0 z-[95] bg-ink/40 lg:hidden"></div>
    <aside id="sidebar" class="fixed lg:sticky top-0 right-0 z-[96] h-screen w-[270px] shrink-0 bg-white border-l border-[color:var(--line)] flex flex-col p-4 translate-x-full lg:translate-x-0 transition-transform duration-300">
      <a href="#dashboard" class="flex flex-col items-center leading-none py-3 mb-3">
        <span class="logo-script text-[44px] text-mauve">Alaa</span>
        <span class="text-[8px] tracking-[.22em] text-mauve/70 -mt-1">براند ألاء • لوحة التحكم</span>
      </a>
      <nav id="adminNav" class="flex flex-col gap-1 overflow-y-auto flex-1 pr-0.5"></nav>
      <div class="pt-3 mt-3 border-t border-[color:var(--line)]">
        <a href="index.html" target="_blank" rel="noopener" class="nav-item"><i class="fa-solid fa-store"></i> فتح المتجر</a>
        <p class="text-[11px] muted px-3 pt-2 truncate" id="loggedInAs"></p>
        <button data-act="logout" class="nav-item !text-[color:var(--crit)]"><i class="fa-solid fa-arrow-right-from-bracket !text-[color:var(--crit)]"></i> تسجيل الخروج</button>
      </div>
    </aside>

    <main class="flex-1 min-w-0 px-4 md:px-8 pb-24 pt-5 lg:pt-7 max-w-[1500px]">
      <div class="flex items-start justify-between gap-3 mb-6 flex-wrap">
        <div>
          <h1 class="text-2xl md:text-[1.75rem] font-extrabold text-mauveD" id="pageTitle">لوحة التحكم</h1>
          <p class="text-xs muted mt-1 flex items-center gap-2 flex-wrap"><span id="pageSub"></span><span class="inline-flex items-center gap-1.5" id="connStatus"><span class="w-2 h-2 rounded-full" style="background:#0ca30c"></span> متصلة مباشرة</span></p>
        </div>
        <div class="hidden lg:flex items-center gap-2">
          <button data-act="openCmd" class="chip !rounded-xl flex items-center gap-2 !px-4 !py-2 min-w-[210px] justify-between"><span class="flex items-center gap-2 muted"><i class="fa-solid fa-magnifying-glass"></i> بحث شامل</span><span class="kbd" dir="ltr">Ctrl K</span></button>
          <button class="btn-icon relative !w-10 !h-10 bg-white border border-[color:var(--line)]" data-act="openBell" aria-label="التنبيهات"><i class="fa-regular fa-bell"></i><span class="bellCount hidden absolute -top-1 -left-1 bg-mauveD text-white text-[10px] font-bold min-w-[18px] h-[18px] rounded-full flex items-center justify-center px-1"></span></button>
          <button class="btn" data-act="newOrder"><i class="fa-solid fa-plus"></i> طلب يدوي</button>
        </div>
      </div>
      <div id="adminContent"></div>
    </main>
  </div>
</div>

<script>
window.addEventListener('error',function(e){try{if(document.getElementById('__jsErr'))return;var d=document.createElement('div');d.id='__jsErr';d.style.cssText='position:fixed;bottom:12px;left:12px;right:12px;z-index:9999;background:#7a1f2b;color:#fff;padding:10px 14px;border-radius:12px;font:12px/1.6 sans-serif;direction:ltr';d.textContent='JS error: '+(e.message||'')+' '+(e.filename||'').split('/').pop()+':'+(e.lineno||'');document.body.appendChild(d)}catch(x){}});
</script>
<script type="module" src="/src/admin/main.js"></script>
</body>
</html>
